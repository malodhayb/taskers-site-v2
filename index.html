<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taskers | تاسكرز</title>
<meta name="description" content="Taskers - a Saudi task marketplace connecting requesters and taskers with bidding, real sign-in, and SAR payments." />
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Optional real authentication (Supabase). Fill in config.js with your project's
     values to enable it; otherwise the app safely falls back to demo accounts. -->
<script src="config.js"></script>
<script type="module">
  if (window.SUPABASE_CONFIGURED) {
    import("https://esm.sh/@supabase/supabase-js@2").then(({ createClient }) => {
      window.supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      document.dispatchEvent(new Event("supabase-ready"));
    });
  }
</script>
<script src="bundle.js"></script>
</body>
</html>
