<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Taskers | تاسكرز</title>
<meta name="description" content="Taskers - a Saudi task marketplace connecting requesters and taskers with bidding, real sign-in, maps, and SAR payments." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Map tiles (OpenStreetMap via Leaflet) - no API key required -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Optional real authentication (Supabase). Fill in config.js with your project's
     values to enable it; otherwise the app safely falls back to demo-free local mode. -->
<script src="config.js"></script>
<script type="module">
  if (window.SUPABASE_CONFIGURED) {
    import("https://esm.sh/@supabase/supabase-js@2").then(({ createClient }) => {
      window.supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      document.dispatchEvent(new Event("supabase-ready"));
    });
  }
</script>
<script src="bundle.js"></script>
</body>
</html>
